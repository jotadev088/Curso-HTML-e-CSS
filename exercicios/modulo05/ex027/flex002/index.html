<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        /* Flex-direction

            row: linha - horizontal - esquerda pra direita
            row-reverse: direita para a esquerda
            column: coluna - vertical - cima para baixo
            columns-reverse: vertical - baixo para cima

            Eixos (axis)

            main-axis : main-star & main-end
            cross-axis : cross-start & cross-end

            flex-wrap: empacotamento
            flex-wrap: nowrap; = não quebra (padrão)
            flex-wrap: wrap; = quebra no sentido do main-axis
            flex-wrap: wrap-reverse; = óbvio

        */

        div.container {
            background-color: lightgreen;

            display: flex;
            flex-direction: row;
        }

        div.item {
            background-color: antiquewhite;
            border: 1px solid black;
            padding: 10px;
            text-align: center;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>

    </div>
    
</body>
</html>
