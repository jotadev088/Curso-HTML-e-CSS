<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        * {
            font-family: monospace;
            font-size: 1.2em;
        }

        div.container {
            background-color: rgb(3, 248, 248);
            height: 95vh;

            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
        }

        div.item {
            background-color: rgb(248, 142, 3);
            border: 1px solid black;
            padding: 50px;
            text-align: center;
        }

        div#i1 {
            align-self: auto;
        }

        div#i2 {
            align-self: center;
        }

        div#i3 {
            align-self: flex-end;
        }

        div#i4 {
            align-self: stretch;
        }

        div#i5 {
            align-self: auto;
        }

        div#i6 {
            align-self: auto;
        }

        div#i7 {
            align-self: auto;
        }

        div#i8 {
            align-self: auto;
        }

        div#i9 {
            align-self: auto;
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
        <div class="item" id="i8">H</div>
        <div class="item" id="i9">I</div>

    </div>
    
</body>
</html>
