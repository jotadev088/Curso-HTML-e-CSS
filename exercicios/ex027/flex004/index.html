<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        * {
            font-family: monospace;
            font-size: 1.2em;
        }

        div.container {
            background-color: lightcyan;
            height: 500px;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-around;
            align-items: center;
        }

        div.item {
            background-color: antiquewhite;
            border: 1px solid black;
            padding: 50px;
            text-align: center;

        }

        /* Align-items
            \_Alinhamento dos itens no sentido do cross-axis

            align-items: flex-start = gruda no cross-start.

            align-items: flex-end = gruda no cross-end.

            align-items: center = alinha no meio do cross-axis.

            flex-container = 
        
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>

    </div>
    
</body>
</html>
