<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: monospace;
            font-size: 1.5em;
        }

        div.container {
            background-color: rgb(8, 233, 233);
            height: 100vh;
            width: 100vw;

            display: flex;
            flex-flow: row nowrap;
            justify-content: flex-start;
            align-items: flex-start;
        }

        div.item {
            background-color: rgb(241, 139, 5);
            border: 1px solid black;
            padding: 50px;
            text-align: center;

            flex-basis: 150px;
        }

        div#cxA {
            flex-shrink: 2;
            flex-grow: 1;
        }

        div#cxB {
            flex-shrink: 0;
            flex-grow: 0;
        }

        div#cxC {
            flex-shrink: 1;
            flex-grow: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>

    </div>
    
</body>
</html>
