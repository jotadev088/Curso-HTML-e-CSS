<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário!</h1>

    <form action="cadastro.php" autocomplete="off" method="post">
        <p>
            <label for="inome">Nome:</label> 
            <input type="text" name="nome" id="inome">
        </p>
        <p>
            <label for="isobrenome">Sobrenome:</label> 
            <input type="text" name="sobrenome" id="isobrenome">
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>

    <!-- 
        label e /label = vincular texto à caixa de resposta.
    
        Métodos para envio de formulário
        method -> padrão = GET 
        POST = Esconde dados da URL, mas ainda aparecem no DevTools.
        Para proteger 100% os dados do forms é necessário o uso da linguagem do "action"(servidor), ex: PHP, Java...
    -->
    
</body>
</html>
